name: iOS Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test-ipa:
    runs-on: macos-latest
    env:
      IOS_SIGNING_ENABLED: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_PROFILE_NAME != '' && secrets.IOS_TEAM_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Prepare build output directory
        run: mkdir -p build

      - name: Run unit tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone Simulator was found on this runner." >&2
            exit 1
          fi
          xcodebuild test \
            -project LiquidFinance.xcodeproj \
            -scheme LiquidFinance \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Install Apple signing certificate and profile
        if: ${{ env.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/liquidfinance-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Archive and export signed IPA
        if: ${{ env.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          xcodebuild archive \
            -project LiquidFinance.xcodeproj \
            -scheme LiquidFinance \
            -configuration Release \
            -archivePath build/LiquidFinance.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": os.environ["IOS_EXPORT_METHOD"],
              "signingStyle": "manual",
              "teamID": os.environ["IOS_TEAM_ID"],
              "provisioningProfiles": {"vn.liquidfinance.app": os.environ["IOS_PROFILE_NAME"]},
          }
          with open("build/ExportOptions.plist", "wb") as output:
              plistlib.dump(options, output)
          PY
          mkdir -p build/output
          xcodebuild -exportArchive \
            -archivePath build/LiquidFinance.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Build unsigned iOS app
        if: ${{ env.IOS_SIGNING_ENABLED != 'true' }}
        run: >-
          xcodebuild build
          -project LiquidFinance.xcodeproj
          -scheme LiquidFinance
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        if: ${{ env.IOS_SIGNING_ENABLED != 'true' }}
        run: |
          mkdir -p build/output/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/LiquidFinance.app build/output/Payload/LiquidFinance.app
          cd build/output
          /usr/bin/zip -qry LiquidFinance-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFinance-ipa
          path: build/output/*.ipa
          if-no-files-found: error
          retention-days: 14
