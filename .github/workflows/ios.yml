name: iOS Build and Test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build-test-ipa:
    runs-on: macos-latest
    env:
      IOS_SIGNING_ENABLED: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_PROFILE_NAME != '' && secrets.IOS_TEAM_ID != '' }}
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v3.8.') && github.ref_name || format('v3.8.{0}', github.run_number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Validate release tag version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v3\.8\.[0-9]+$ ]]; then
            echo "Release tags must use the current v3.8 version (for example v3.8.0)." >&2
            exit 1
          fi

      - name: Validate WidgetKit extension metadata
        run: |
          plutil -lint Widgets/Info.plist
          EXTENSION_POINT=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - Widgets/Info.plist)
          test "$EXTENSION_POINT" = "com.apple.widgetkit-extension"
          xcodebuild -showBuildSettings \
            -project LiquidFinance.xcodeproj \
            -target LiquidFinanceWidgets \
            -sdk iphonesimulator | grep -q 'PRODUCT_BUNDLE_IDENTIFIER = vn.liquidfinance.app.widgets'

      - name: Prepare build output directory
        run: mkdir -p build

      - name: Run unit tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone Simulator was found on this runner." >&2
            exit 1
          fi
          xcodebuild test \
            -project LiquidFinance.xcodeproj \
            -scheme LiquidFinance \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Set release version in app and widget plists
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" LiquidFinance-Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" LiquidFinance-Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Widgets/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Widgets/Info.plist
          plutil -lint LiquidFinance-Info.plist Widgets/Info.plist

      - name: Install Apple signing certificate and profile
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/liquidfinance-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Archive and export signed IPA
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.IOS_SIGNING_ENABLED == 'true' }}
        env:
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          xcodebuild archive \
            -project LiquidFinance.xcodeproj \
            -scheme LiquidFinance \
            -configuration Release \
            -archivePath build/LiquidFinance.xcarchive \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="${RELEASE_VERSION#v}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": os.environ["IOS_EXPORT_METHOD"],
              "signingStyle": "manual",
              "teamID": os.environ["IOS_TEAM_ID"],
              "provisioningProfiles": {"vn.liquidfinance.app": os.environ["IOS_PROFILE_NAME"]},
          }
          with open("build/ExportOptions.plist", "wb") as output:
              plistlib.dump(options, output)
          PY
          mkdir -p build/output
          xcodebuild -exportArchive \
            -archivePath build/LiquidFinance.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist build/ExportOptions.plist
          mv build/output/LiquidFinance.ipa "build/output/LiquidFinance-${RELEASE_VERSION}.ipa"

      - name: Build unsigned iOS app
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.IOS_SIGNING_ENABLED != 'true' }}
        run: >-
          xcodebuild build
          -project LiquidFinance.xcodeproj
          -scheme LiquidFinance
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build/DerivedData
          MARKETING_VERSION="${RELEASE_VERSION#v}"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.IOS_SIGNING_ENABLED != 'true' }}
        run: |
          mkdir -p build/output/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/LiquidFinance.app build/output/Payload/LiquidFinance.app
          cd build/output
          /usr/bin/zip -qry "LiquidFinance-${RELEASE_VERSION}.ipa" Payload
          rm -rf Payload

      - name: Verify IPA version and full-screen metadata
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        env:
          EXPECTED_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          EXPECTED_VERSION="${EXPECTED_VERSION#v}" python3 - <<'PY'
          import os
          import plistlib
          import zipfile

          ipa = f"build/output/LiquidFinance-{os.environ['RELEASE_VERSION']}.ipa"
          expected_version = os.environ["EXPECTED_VERSION"]
          expected_build = os.environ["GITHUB_RUN_NUMBER"]
          with zipfile.ZipFile(ipa) as package:
              app_path = "Payload/LiquidFinance.app/"
              app = plistlib.loads(package.read(app_path + "Info.plist"))
              widget = plistlib.loads(package.read(app_path + "PlugIns/LiquidFinanceWidgets.appex/Info.plist"))
              assert app["CFBundleShortVersionString"] == expected_version, app["CFBundleShortVersionString"]
              assert app["CFBundleVersion"] == expected_build, app["CFBundleVersion"]
              assert widget["CFBundleShortVersionString"] == expected_version, widget["CFBundleShortVersionString"]
              assert widget["CFBundleVersion"] == expected_build, widget["CFBundleVersion"]
              assert 1 in app["UIDeviceFamily"], app.get("UIDeviceFamily")
              launch_storyboard = app.get("UILaunchStoryboardName")
              assert launch_storyboard == "LaunchScreen", f"Unexpected UILaunchStoryboardName: {launch_storyboard!r}"
              assert any(name.startswith(app_path + launch_storyboard + ".storyboardc/") for name in package.namelist()), "Launch storyboard is missing from the IPA"
          print(f"Verified IPA app/widget version {expected_version} ({expected_build}); iPhone launch screen is packaged.")
          PY

      - name: Publish versioned IPA to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Liquid Finance ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: build/output/*.ipa
