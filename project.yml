name: LiquidFinance
options:
  bundleIdPrefix: com.liquidfinance
  deploymentTarget:
    iOS: "17.0"
packages:
  LiquidFinanceCore:
    path: .
targets:
  LiquidFinance:
    type: application
    platform: iOS
    sources: [App/LiquidFinance]
    dependencies:
      - package: LiquidFinanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liquidfinance.app
        PRODUCT_NAME: LiquidFinance
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LiquidFinance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: Mở khóa LiquidFinance bằng Face ID
