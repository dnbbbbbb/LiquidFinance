name: LiquidFinance
options:
  bundleIdPrefix: vn.liquidfinance
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: vi
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "4.1.0"
    CURRENT_PROJECT_VERSION: "41"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "LiquidFinance"
targets:
  LiquidFinance:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - LaunchScreen.storyboard
      - path: Sources/LaunchScreen.storyboard
        buildPhase: resources
      - path: Assets.xcassets
    info:
      path: LiquidFinance-Info.plist
      properties:
        CFBundleDisplayName: "LiquidFinance"
        CFBundleURLTypes:
          - CFBundleURLName: vn.liquidfinance.app
            CFBundleURLSchemes: [liquidfinance]
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIDeviceFamily: [1]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.liquidfinance.app
        # Keep the internal module identifier stable so existing widgets and tests continue to link.
        PRODUCT_NAME: LiquidFinance
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: LiquidFinance.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    dependencies:
      - target: LiquidFinanceWidgets
        embed: true
  LiquidFinanceWidgets:
    type: app-extension
    subtype: widgetkit-extension
    platform: iOS
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.liquidfinance.app.widgets
        PRODUCT_NAME: LiquidFinanceWidgets
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/LiquidFinanceWidgets.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LiquidFinanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: LiquidFinanceTests
    dependencies:
      - target: LiquidFinance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.liquidfinance.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LiquidFinance:
    build:
      targets:
        LiquidFinance: all
        LiquidFinanceTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LiquidFinanceTests
